<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>NitroAssist | نيتروأسيست</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f6f8fb;--card:#fff;--ink:#14243a;--mut:#4d5d72;--navy:#0c2745;--teal:#0f8f7d;--tealb:#17a592;--gold:#e0b04a;--line:#dbe2ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html.hc{--bg:#fff;--card:#fff;--ink:#000;--mut:#000;--teal:#00574b;--tealb:#00574b;--line:#000}
html{scroll-padding-top:100px}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,'DejaVu Sans',Tahoma,sans-serif;line-height:1.7;font-size:1rem}
a{color:inherit;text-decoration:none}.w{max-width:1040px;margin:0 auto;padding:0 18px}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.skip{position:absolute;top:-60px;inset-inline-start:8px;background:#000;color:#fff;padding:10px 16px;border-radius:8px;z-index:20}.skip:focus{top:8px}
html.hc a{text-decoration:underline}html.hc .card,html.hc .box,html.hc input,html.hc select,html.hc .st div,html.hc .chips button{border:2px solid #000}html.hc .btn{background:#000;color:#fff;border:2px solid #000}html.hc .btn.o{background:#fff;color:#000}html.hc .tag{background:#fff;color:#000;border:1px solid #000}
nav{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;justify-content:space-between;min-height:72px;gap:10px;flex-wrap:wrap}
nav img{height:54px;width:auto;display:block}nav .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}nav a.l{font-size:.9rem;color:var(--mut)}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:700;padding:11px 20px;border-radius:10px;background:var(--teal);color:#fff;text-align:center;min-height:44px}
.btn.o{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.s{padding:6px 14px;font-size:.85rem}.btn.wa{background:#1f8f3f}
.ap{background:var(--card);border-top:1px solid var(--line)}.ap .w{padding-top:12px;padding-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ap .hp{flex-basis:100%;color:var(--mut);font-size:.85rem;margin:0}
.btn[aria-pressed="true"]{background:var(--navy);color:#fff}
.hero{background:linear-gradient(160deg,#081a31,#0c2745 60%,#13365e);color:#fff;padding:60px 0 70px}
.hero h1{font-size:clamp(1.75rem,5.4vw,2.9rem);line-height:1.25;margin:0 0 12px;max-width:720px}.hero h1 span{color:var(--gold)}
.hero p{color:#dbe5f3;margin:0 0 22px;max-width:620px}.hero .b{display:flex;gap:10px;flex-wrap:wrap}.hero .btn.o{color:#fff;border-color:#8ea3c4}
.st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:-34px auto 0;position:relative}
.st div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}.st b{display:block;font-size:1.6rem;color:var(--teal)}.st span{font-size:.8rem;color:var(--mut)}
section{padding:46px 0 6px}h2{font-size:1.65rem;margin:0 0 6px;color:var(--navy)}html.hc h2{color:#000}.sub{color:var(--mut);margin:0 0 18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chips button{font:inherit;font-size:.9rem;cursor:pointer;padding:8px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}.chips button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{background:#fff;height:190px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}.pic img{width:100%;height:100%;object-fit:contain}.ph{color:#5b6b80;font-size:.85rem;text-align:center;padding:10px}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{align-self:flex-start;font-size:.75rem;font-weight:700;color:var(--teal);background:color-mix(in srgb,var(--teal) 13%,transparent);padding:1px 10px;border-radius:99px}
.cb h3{margin:0;font-size:1.05rem;line-height:1.35}.cb p{margin:0;color:var(--mut);font-size:.88rem;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}.pr{font-weight:700;color:var(--teal);font-size:1.2rem}.pr small{font-size:.75rem;color:var(--mut);font-weight:400}
.q{display:flex;align-items:center;gap:6px}.q button{min-width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.2rem;cursor:pointer;line-height:1}.q b{min-width:24px;text-align:center}
.q button.ls{font-size:1rem}
.more{margin-top:16px;text-align:center;color:var(--mut)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.ol{margin:0 0 14px;padding:0;list-style:none}.ol li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}.ol .tt{font-weight:700;border:0;color:var(--teal);font-size:1.1rem}
form{display:grid;gap:12px;grid-template-columns:1fr 1fr}form .f{grid-column:1/-1}label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:3px}
.ip{display:flex;gap:6px}.ip input{flex:1}.ip button{min-width:44px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:1.1rem}
input,select{width:100%;font:inherit;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
.done{display:none;margin-top:14px;padding:14px;border:2px dashed var(--teal);border-radius:12px;font-size:.9rem}.done pre{white-space:pre-wrap;font:inherit;margin:8px 0}.done .a{display:flex;gap:8px;flex-wrap:wrap}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.g3 .box h3{margin:0 0 4px;font-size:1.1rem}.g3 .box p{margin:0;color:var(--mut);font-size:.9rem}
footer{margin-top:50px;background:var(--navy);color:#dbe5f3;padding:28px 0;font-size:.9rem}footer .w{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px}footer .sl{display:inline-block;margin-top:4px;color:#2fd0b8;font-weight:700;font-size:1rem;letter-spacing:.3px}footer a{text-decoration:underline;text-underline-offset:3px}footer b{color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){form,.g3,footer .w{grid-template-columns:1fr}.st{margin-top:18px;gap:8px}.st div{padding:10px 6px}.st span{font-size:.72rem;overflow-wrap:anywhere}.hero{padding:36px 0}nav a.l{display:none}}
</style></head><body>

function nrm(s){s=String(s).toLowerCase().replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");return s.replace(/[^a-z0-9\u0621-\u064a\s]/g," ")}
function toks(s){return nrm(s).split(/\s+/).filter(function(w){return w.length>=3}).map(function(w){return w.length>4?w.replace(/^(ال|لل|بال|وال)/,""):w})}
function findP(t){var tt=toks(t),best=null,bs=0,bm=0,isA=/[\u0600-\u06ff]/.test(t);P.forEach(function(p){var pt_=toks(isA?p.ar:p.en),m=0,seen={};pt_.forEach(function(w){if(!seen[w]){seen[w]=1;if(tt.indexOf(w)>-1)m++}});var u=Object.keys(seen).length,sc=m/u;if(m&&sc>=.5&&(sc>bs||(sc==bs&&m>bm))){best=p;bs=sc;bm=m}});return best}
var NW={واحد:1,وحده:1,اتنين:2,اثنين:2,اثنان:2,تلاته:3,ثلاثه:3,اربعه:4,خمسه:5,سته:6,سبعه:7,تمانيه:8,ثمانيه:8,تسعه:9,عشره:10,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
function qty(t){var m=nrm(t).match(/\d+/);if(m)return +m[0];var w=nrm(t).split(/\s+/);for(var i=0;i<w.length;i++)if(NW[w[i]])return NW[w[i]];return 1}
function rest(t,re){var m=String(t).match(new RegExp(re.source,"i"));return m?String(t).slice(m.index+m[0].length).trim():""}
function setF(id,v){$(id).value=v;live(S("تم تسجيل: ","Saved: ")+v)}
function handle(raw){var t=nrm(raw),p;
if(/توقف|وقف|اسكت|stop|quiet/.test(t)){stopS();return}
if(/ارسل الطلب|ارسال الطلب|ابعت الطلب|اكد الطلب|send order|submit order|place order/.test(t)){return doSubmit()}
if(/امسح الطلب|الغ الطلب|clear order|cancel order/.test(t)){Q={};lastF=null;draw();return live(S("تم مسح الطلب","Order cleared"))}
if(/اسمي|my name is/.test(t)){return setF("nm",rest(raw,/اسمي|my name is/))}
if(/رقمي|رقم هاتفي|رقم التليفون|تليفوني|my phone( number)? is|my number is/.test(t)){return setF("ph",(nrm(raw).replace(/[^0-9]/g,"")||rest(raw,/رقمي|my number is/)))}
if(/عنواني|my address is/.test(t)){return setF("ct",rest(raw,/عنواني|my address is/))}
if(/مساعده|help/.test(t)){return speak([$("hlp").textContent])}
p=findP(t);
if(/اقرا|وصف|read|describe|listen/.test(t)){if(/طلب|order/.test(t)&&!p)return speak([ot()]);if(p)return speak([pt(p)]);return readPage()}
if(/احذف|شيل|قلل|امسح|remove|delete|decrease/.test(t)&&p){return setQ(p.id,-qty(t.replace(/\d/g,function(d){return d})))}
if(p){return setQ(p.id,qty(t))}
if(/طلبي|الطلب|my order/.test(t))return speak([ot()]);
live(S("لم أفهم. قل مساعدة لسماع الأوامر.","I didn’t catch that. Say help to hear the commands."))}
function startV(){if(!SR){live(S("المتصفح لا يدعم الأوامر الصوتية. جرّب Chrome أو Edge.","This browser doesn’t support voice commands. Try Chrome or Edge."));return}
rec=new SR();rec.lang=LC[lang];rec.continuous=true;rec.interimResults=false;
rec.onresult=function(e){for(var i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal&&!(SS&&SS.speaking))handle(e.results[i][0].transcript)};
rec.onend=function(){if(voiceOn){try{rec.start()}catch(x){}}};
rec.onerror=function(ev){if(ev.error=="not-allowed"||ev.error=="service-not-allowed"){voiceOn=false;$("vc").setAttribute("aria-pressed",false);live(S("لم يتم السماح بالميكروفون.","Microphone permission was not granted."))}};
voiceOn=true;$("vc").setAttribute("aria-pressed",true);try{rec.start()}catch(x){}speak([S("الأوامر الصوتية تعمل. قل مساعدة لسماع الأوامر.","Voice commands are on. Say help to hear the commands.")])}
function stopV(){voiceOn=false;$("vc").setAttribute("aria-pressed",false);if(rec)try{rec.stop()}catch(x){}stopS()}
document.querySelectorAll(".mic").forEach(function(b){b.onclick=function(){if(!SR){live(S("المتصفح لا يدعم الإملاء الصوتي.","This browser doesn’t support dictation."));return}var r=new SR(),id=b.getAttribute("data-f");r.lang=LC[lang];r.onresult=function(e){var v=e.results[0][0].transcript;if(id=="ph")v=nrm(v).replace(/[^0-9+]/g,"")||v;setF(id,v)};r.onerror=function(){live(S("تعذّر الإملاء.","Dictation failed."))};try{r.start();live(S("تحدّث الآن","Speak now"))}catch(x){}}});

var its=P.filter(function(p){return Q[p.id]}),L=its.map(function(p){return "• "+Q[p.id]+" × "+nm(p)+" = "+Q[p.id]*p.price}).join("\n");

$("msg").textContent=m;$("w1").href=wa(C.zw,m);$("w2").href=wa(C.rw,m);$("em").href="mailto:"+C.ze+","+C.re+"?subject="+encodeURIComponent("NitroAssist order")+"&body="+encodeURIComponent(m);
function showD(mode){var ok=mode=="ok",er=mode=="er";$("dt").style.display=(ok||er)?"none":"";$("msg").style.display=ok?"none":"";$("lk").style.display=ok?"none":"";$("ok").style.display=ok?"block":"none";$("er").style.display=er?"block":"none";$("done").style.display="block";$("done").focus()}
if(C.sheet&&C.sheet.indexOf("https://script.google.com")==0){var b=e.target.querySelector("button.btn");b.disabled=true;live(S("جارٍ إرسال طلبك…","Sending your order…"));
var ctl=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort()},20000);
fetch(C.sheet,{method:"POST",mode:"no-cors",signal:ctl?ctl.signal:undefined,body:JSON.stringify({name:$("nm").value,phone:$("ph").value,address:$("ct").value,items:its.map(function(p){return Q[p.id]+" × "+p.en+" ("+p.price+")"}).join("; "),lines:its.map(function(p){return {name:p.ar,qty:Q[p.id],price:p.price}}),total:T0,lang:lang})}).then(function(){clearTimeout(tm);b.disabled=false;showD("ok");live(S("تم استلام طلبك وسنتواصل معك قريبًا.","Your order was received. We will contact you soon."));f1.reset();Q={};draw()}).catch(function(){clearTimeout(tm);b.disabled=false;showD("er");live(S("تعذّر إرسال الطلب. أرسله عبر واتساب.","Could not send the order. Please send it on WhatsApp."))})}
else{showD("msg");window.open(wa(C.zw,m),"_blank");live(S("رسالة الطلب جاهزة على واتساب.","Your order message is ready on WhatsApp."))}};
